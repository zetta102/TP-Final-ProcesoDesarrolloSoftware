spring:
  application:
    name: final
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: secret
  threads:
    virtual:
      enabled: true

management:
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
